<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Advanced Cards</title>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <link rel="stylesheet" href="cads.css">
</head>
<body>

<button class="dark-toggle">🌙 Toggle Dark Mode</button>

<section class="cards-container">
  
  <div class="card">
    <div class="card-img">
      <img src="https://images.unsplash.com/photo-1535223289827-42f1e9919769" />
      <div class="overlay">Cloud Services</div>
    </div>
    <div class="card-content">
      <h3>Cloud Hosting</h3>
      <p>Fast & secure cloud solutions.</p>
      <h2 class="count" data-count="120">0</h2>
    </div>
  </div>

  <div class="card">
    <div class="card-img">
      <img src="https://images.unsplash.com/photo-1558494949-ef010cbdcc31" />
      <div class="overlay">Security</div>
    </div>
    <div class="card-content">
      <h3>Cyber Security</h3>
      <p>Advanced protection systems.</p>
      <h2 class="count" data-count="85">0</h2>
    </div>
  </div>

  <div class="card">
    <div class="card-img">
      <img src="https://images.unsplash.com/photo-1581091012184-7f6e8ee7c58a" />
      <div class="overlay">AI Solutions</div>
    </div>
    <div class="card-content">
      <h3>AI Integration</h3>
      <p>Smart automation tools.</p>
      <h2 class="count" data-count="200">0</h2>
    </div>
  </div>

</section>

<script src="cards.js"></script>
</body>
</html>
